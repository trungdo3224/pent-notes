<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <style>
      .card-bg { fill: #161b25; }
      .card-border { stroke: #283142; stroke-width: 1.2; }
      .pill { fill: #222938; stroke: #364258; stroke-width: 1; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 15px; font-weight: 700; fill: #f8fafc; }
      .desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12.5px; fill: #8b9bb4; line-height: 1.5; }
      .tag { font-family: "JetBrains Mono", monospace; font-size: 10px; font-weight: 600; }
    </style>
  </defs>

  <!-- 4 Feature Cards in a 2x2 or 4x1 grid: 4 columns x 1 row -->
  
  <!-- Column 1: Flexible Split Panes -->
  <g transform="translate(15, 20)">
    <rect width="275" height="380" rx="10" class="card-bg card-border" />
    
    <!-- Mini Graphic / Mock -->
    <g transform="translate(18, 20)">
      <rect width="239" height="150" rx="6" fill="#141821" stroke="#283142" />
      <!-- Horizontal / Vertical Split illustration -->
      <rect x="10" y="10" width="105" height="130" rx="4" fill="#1b212d" stroke="#00e5ff" stroke-width="1.2" />
      <rect x="124" y="10" width="105" height="60" rx="4" fill="#1b212d" stroke="#283142" />
      <rect x="124" y="78" width="105" height="62" rx="4" fill="#1b212d" stroke="#283142" />
      <circle cx="119" cy="74" r="3" fill="#00e5ff" />
    </g>

    <g transform="translate(18, 195)">
      <rect width="84" height="20" rx="10" class="pill" />
      <text x="10" y="14" class="tag" fill="#00e5ff">MULTI-PANE</text>
      
      <text x="0" y="46" class="title">Flexible Split Grid</text>
      <text x="0" y="72" class="desc">
        <tspan x="0" dy="0">Split your workspace infinitely</tspan>
        <tspan x="0" dy="18">in vertical, horizontal, or grid</tspan>
        <tspan x="0" dy="18">layouts with drag-to-resize handles</tspan>
        <tspan x="0" dy="18">and multi-tab management.</tspan>
      </text>
    </g>
  </g>

  <!-- Column 2: CodeMirror Markdown & PDF -->
  <g transform="translate(310, 20)">
    <rect width="275" height="380" rx="10" class="card-bg card-border" />
    
    <!-- Mini Graphic / Mock -->
    <g transform="translate(18, 20)">
      <rect width="239" height="150" rx="6" fill="#141821" stroke="#283142" />
      <!-- Code lines -->
      <line x1="20" y1="26" x2="90" y2="26" stroke="#f43f5e" stroke-width="3" stroke-linecap="round" />
      <line x1="20" y1="46" x2="190" y2="46" stroke="#d1d9e6" stroke-width="2" stroke-linecap="round" />
      <line x1="20" y1="62" x2="150" y2="62" stroke="#d1d9e6" stroke-width="2" stroke-linecap="round" />
      <!-- PDF / Document icon block -->
      <rect x="20" y="80" width="199" height="50" rx="4" fill="#12161f" stroke="#283142" />
      <text x="32" y="110" font-family="monospace" font-size="11" fill="#10b981">const note = sync(disk);</text>
    </g>

    <g transform="translate(18, 195)">
      <rect width="78" height="20" rx="10" class="pill" />
      <text x="10" y="14" class="tag" fill="#38bdf8">EDITOR</text>
      
      <text x="0" y="46" class="title">CodeMirror 6 + PDF</text>
      <text x="0" y="72" class="desc">
        <tspan x="0" dy="0">Blazing-fast markdown writing</tspan>
        <tspan x="0" dy="18">with syntax highlighting, inline</tspan>
        <tspan x="0" dy="18">decorations, image support, and</tspan>
        <tspan x="0" dy="18">side-by-side native PDF viewing.</tspan>
      </text>
    </g>
  </g>

  <!-- Column 3: Local-First Storage -->
  <g transform="translate(605, 20)">
    <rect width="275" height="380" rx="10" class="card-bg card-border" />
    
    <!-- Mini Graphic / Mock -->
    <g transform="translate(18, 20)">
      <rect width="239" height="150" rx="6" fill="#141821" stroke="#283142" />
      <!-- Disk / Folder illustration -->
      <g transform="translate(45, 30)">
        <rect x="0" y="0" width="150" height="90" rx="6" fill="#1b212d" stroke="#10b981" stroke-width="1.2" />
        <path d="M 12 18 L 40 18 L 48 26 L 138 26 L 138 72 L 12 72 Z" fill="#10b981" opacity="0.25" />
        <circle cx="75" cy="45" r="14" fill="none" stroke="#10b981" stroke-width="2" />
        <path d="M 75 37 L 75 45 L 81 48" stroke="#10b981" stroke-width="1.5" />
      </g>
    </g>

    <g transform="translate(18, 195)">
      <rect width="90" height="20" rx="10" class="pill" />
      <text x="10" y="14" class="tag" fill="#10b981">LOCAL-FIRST</text>
      
      <text x="0" y="46" class="title">Direct Disk Linking</text>
      <text x="0" y="72" class="desc">
        <tspan x="0" dy="0">Your notes are just plain files</tspan>
        <tspan x="0" dy="18">on your hard drive. Zero lock-in,</tspan>
        <tspan x="0" dy="18">instant bidirectional syncing,</tspan>
        <tspan x="0" dy="18">and multi-workspace sessions.</tspan>
      </text>
    </g>
  </g>

  <!-- Column 4: Local Ollama AI -->
  <g transform="translate(900, 20)">
    <rect width="275" height="380" rx="10" class="card-bg card-border" />
    
    <!-- Mini Graphic / Mock -->
    <g transform="translate(18, 20)">
      <rect width="239" height="150" rx="6" fill="#141821" stroke="#283142" />
      <!-- AI Chat bubble graphic -->
      <rect x="18" y="24" width="150" height="38" rx="6" fill="#1e2638" stroke="#283142" />
      <line x1="28" y1="38" x2="140" y2="38" stroke="#8b9bb4" stroke-width="2" />
      <rect x="70" y="74" width="150" height="52" rx="6" fill="#162235" stroke="#00e5ff" stroke-width="1" />
      <circle cx="86" cy="92" r="5" fill="#00e5ff" />
      <line x1="98" y1="92" x2="195" y2="92" stroke="#d1d9e6" stroke-width="2" />
      <line x1="86" y1="108" x2="170" y2="108" stroke="#10b981" stroke-width="2" />
    </g>

    <g transform="translate(18, 195)">
      <rect width="76" height="20" rx="10" class="pill" />
      <text x="10" y="14" class="tag" fill="#c084fc">OLLAMA AI</text>
      
      <text x="0" y="46" class="title">Private Local AI</text>
      <text x="0" y="72" class="desc">
        <tspan x="0" dy="0">Chat with local LLMs via</tspan>
        <tspan x="0" dy="18">Ollama directly in the sidebar.</tspan>
        <tspan x="0" dy="18">Includes note context injection</tspan>
        <tspan x="0" dy="18">and web search capabilities.</tspan>
      </text>
    </g>
  </g>
</svg>
